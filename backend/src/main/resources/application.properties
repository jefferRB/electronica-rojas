spring.application.name=electronica-rojas-backend

# ---- Database (ARCH-DEV-003) ----
# No defaults on purpose: if the variables are missing the app fails fast instead of
# connecting somewhere unexpected. Locally, scripts/start-backend.ps1 sets them from .env.
# In tests, Testcontainers (@ServiceConnection) replaces these connection details.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate (ENG-034) ----
# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Loads lazy collections (e.g. user branches in a page of users) in batches, avoiding N+1 queries.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---- Flyway ----
spring.flyway.locations=classpath:db/migration
# Development only (devtools is absent from packaged builds): saving a migration file must not
# restart the running app, or Flyway applies it while it is still being written and any later
# edit becomes a checksum mismatch (see ER-ARCH-001 ADR-012). New migrations apply on the next
# explicit restart.
spring.devtools.restart.additional-exclude=db/migration/**

# ---- Actuator (ARCH-SEC-004, ARCH-API-003) ----
# Only /actuator/health is exposed over HTTP, and it returns just {"status":"UP|DOWN"}.
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Liveness/readiness groups are for Kubernetes probes; they would add "groups" to the public response.
management.endpoint.health.probes.enabled=false

# ---- Security and session (ARCH-SEC-003) ----
# Accounts come from the database (AppUserDetailsService), so Boot's generated in-memory
# user is not created. Set SECURE_COOKIES=true whenever the app is served over HTTPS.
app.security.secure-cookies=${SECURE_COOKIES:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${app.security.secure-cookies}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
# Never put the session id in URLs (;jsessionid=...).
server.servlet.session.tracking-modes=cookie

# ---- Optional first administrator (SEC-004) ----
# Only created when both variables are set and no active administrator exists.
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_NAME:Administrador}

# ---- Logging (OBS-001) ----
# Every log line carries the request correlation id set by CorrelationIdFilter.
logging.pattern.correlation=[%X{correlationId:-}] 

# ---- Demo data (DEV-ONLY, ER-ARCH-001 ADR-021) ----
# Off by default. APP_DEMO_SEED=true loads the fictitious portfolio scenario once at startup, only
# against a local database and with MAIL_MODE=inbox (docs/runbook.md). Never enable it elsewhere.
app.demo.seed=${APP_DEMO_SEED:false}

# ---- Notifications (ER-ARCH-001 ADR-016) ----
# Transactional outbox + worker. Mail goes to the in-memory development inbox unless MAIL_MODE=smtp:
# nothing reaches real people until a provider is configured and authorized.
app.notifications.worker-enabled=${NOTIFICATIONS_WORKER_ENABLED:true}
app.notifications.poll-interval=PT15S
app.notifications.batch-size=20
app.notifications.max-attempts=5
app.notifications.lease=PT2M
app.notifications.mail.mode=${MAIL_MODE:inbox}
app.notifications.mail.from=${MAIL_FROM:no-reply@electronica-rojas.test}
# Base of the public site, for the customer's status link in visit notices (optional).
app.notifications.public-base-url=${PUBLIC_BASE_URL:}
# SMTP server only from the environment or a secret store (never Git): SPRING_MAIL_HOST,
# SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD. STARTTLS and timeouts below.
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# A mail outage must not mark the application DOWN (notifications are retried by the worker).
management.health.mail.enabled=false
