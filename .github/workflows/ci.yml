name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail if environment files are tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Environment files must not be committed:"
            echo "$tracked"
            exit 1
          fi

  migrations:
    name: Applied migrations are immutable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Pull request: compare with the target branch (strict: a missing base fails).
      # Push to main: compare with the previous tip of main; the script skips the comparison only
      # when there is demonstrably no previous revision (see scripts/check-migrations.sh).
      - name: Existing migrations unchanged, new versions allowed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            bash scripts/check-migrations.sh "$PR_BASE"
          else
            bash scripts/check-migrations.sh --push-before "$PUSH_BEFORE"
          fi

  backend:
    name: Backend (Java 25, Maven, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # ubuntu-latest ships a running Docker Engine, which Testcontainers uses for postgres:17.
      # No database credentials are needed: every test run gets a disposable container.
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (Node, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (reproducible, from package-lock.json)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm test
      - name: Color contrast of every palette (WCAG 2.2 AA)
        run: npm run check:contrast
      - name: Type check and build
        run: npm run build
